version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=postgresql://fh_user:fh_password@postgres:5432/founders_hut?schema=public
      - JWT_SECRET=prod_jwt_secret_founders_hut_2026_secure
      - JWT_REFRESH_SECRET=prod_refresh_secret_founders_hut_2026_secure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=fh_user
      - POSTGRES_PASSWORD=fh_password
      - POSTGRES_DB=founders_hut
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fh_user -d founders_hut"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
